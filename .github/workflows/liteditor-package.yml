name: liteditor package

on:
  pull_request:
    paths:
      - 'packages/liteditor/**'
      - 'src/types/schema.ts'
      - '.github/workflows/liteditor-package.yml'
  push:
    branches: [main]
    paths:
      - 'packages/liteditor/**'
      - 'src/types/schema.ts'
      - '.github/workflows/liteditor-package.yml'
    tags:
      - 'liteditor-v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    defaults:
      run:
        working-directory: packages/liteditor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/liteditor/package-lock.json
      - run: npm ci
      # The bundled copy of the editor schema must match src/types/schema.ts
      - run: npm run sync-schema:check
      - run: npm run typecheck
      # Node 20 cannot strip types, so the TypeScript tests need Node >= 22.18
      - run: npm test
        if: matrix.node != 20
      - run: npm run build
      - run: npm pack --dry-run

  publish:
    # Publishes with npm trusted publishing (OIDC): no token. The package's Trusted Publisher
    # setting on npmjs.com must name this repository and this workflow file.
    if: startsWith(github.ref, 'refs/tags/liteditor-v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    defaults:
      run:
        working-directory: packages/liteditor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: packages/liteditor/package-lock.json
      - name: Tag must match package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "liteditor-v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - run: npm publish --access public
