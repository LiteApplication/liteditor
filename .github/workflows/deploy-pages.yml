name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check schema compatibility
        run: npm run schema:test && npm run schema:check

      - name: Build
        # Optional repository variables override the tracked .env (public values only);
        # when unset, the .env values are used.
        run: |
          [ -n "$CLIENT_ID" ] && export VITE_GITHUB_CLIENT_ID="$CLIENT_ID"
          [ -n "$PROXY_URL" ] && export VITE_TOKEN_PROXY_URL="$PROXY_URL"
          npm run build
        env:
          CLIENT_ID: ${{ vars.VITE_GITHUB_CLIENT_ID }}
          PROXY_URL: ${{ vars.VITE_TOKEN_PROXY_URL }}

      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
